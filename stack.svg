<svg width="900" height="360" viewBox="0 0 900 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>

    <!-- Subtle yellow glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#F7C948" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F7C948" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>

  <!-- Moving glow -->
  <ellipse cx="150" cy="80" rx="260" ry="180" fill="url(#glow)">
    <animate
      attributeName="cx"
      values="150;750;150"
      dur="9s"
      repeatCount="indefinite"/>
    <animate
      attributeName="cy"
      values="80;280;80"
      dur="9s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Grid -->
  <rect width="900" height="360" rx="18" fill="url(#grid)"/>

  <!-- Terminal header -->
  <text x="35" y="42"
        fill="#F7C948"
        font-family="monospace"
        font-size="15">
    ~/engineering-stack
  </text>

  <circle cx="825" cy="36" r="5" fill="#F7C948">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2.5s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Divider -->
  <line x1="35" y1="58" x2="865" y2="58"
        stroke="#F7C948"
        stroke-opacity="0.25"/>

  <!-- Stack -->

  <text x="40" y="92"
        fill="#F7C948"
        font-family="monospace"
        font-size="14">
    LANGUAGES
  </text>

  <text x="205" y="92"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    → C++ · JavaScript · Python · SQL
  </text>


  <text x="40" y="140"
        fill="#F7C948"
        font-family="monospace"
        font-size="14">
    CORE CS
  </text>

  <text x="205" y="140"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    → DSA · OOP · DBMS · OS · Computer Networks
  </text>


  <text x="40" y="188"
        fill="#F7C948"
        font-family="monospace"
        font-size="14">
    FULL-STACK
  </text>

  <text x="205" y="188"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    → React · Node.js · Express · MongoDB · REST
  </text>

  <text x="205" y="210"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    WebRTC · Socket.IO · JWT
  </text>


  <text x="40" y="250"
        fill="#F7C948"
        font-family="monospace"
        font-size="14">
    AI / LLM
  </text>

  <text x="205" y="250"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    → LLM APIs · Prompt Engineering · RAG · Vector DBs
  </text>


  <text x="40" y="298"
        fill="#F7C948"
        font-family="monospace"
        font-size="14">
    SYSTEMS
  </text>

  <text x="205" y="298"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    → Kafka/RabbitMQ · Redis · Docker · Kubernetes
  </text>

  <text x="205" y="320"
        fill="#E6E6E6"
        font-family="monospace"
        font-size="14">
    GitHub Actions · OpenTelemetry · k6
  </text>

</svg>
