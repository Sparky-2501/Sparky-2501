<svg width="900" height="360" viewBox="0 0 900 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080F"/>
      <stop offset="50%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <!-- Blue → Pink accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>

    <!-- Pink glow -->
    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#FF2BD6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#FF2BD6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#00C6FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <!-- Soft border glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="900"
        height="360"
        rx="18"
        fill="url(#bg)"/>


  <!-- Subtle grid -->
  <rect width="900"
        height="360"
        rx="18"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- SLOW MOVING BACKGROUND GLOW -->
  <!-- ================================================= -->

  <ellipse cx="160"
           cy="90"
           rx="280"
           ry="190"
           fill="url(#blueGlow)">

    <animate
      attributeName="cx"
      values="160;700;160"
      dur="22s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="90;270;90"
      dur="22s"
      repeatCount="indefinite"/>

  </ellipse>


  <ellipse cx="730"
           cy="270"
           rx="250"
           ry="180"
           fill="url(#pinkGlow)">

    <animate
      attributeName="cx"
      values="730;200;730"
      dur="26s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="270;90;270"
      dur="26s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================================= -->
  <!-- MAC-STYLE TRAFFIC LIGHT DOTS (LEFT) -->
  <!-- ================================================= -->

  <circle cx="45" cy="36" r="6" fill="#FF5F57"/>
  <circle cx="65" cy="36" r="6" fill="#FEBC2E"/>
  <circle cx="85" cy="36" r="6" fill="#28C840"/>


  <!-- ================================================= -->
  <!-- TERMINAL HEADER (RIGHT) -->
  <!-- ================================================= -->

  <text x="865"
        y="42"
        fill="url(#accent)"
        font-family="monospace"
        font-size="15"
        font-weight="600"
        text-anchor="end">

    ~/engineering-stack

  </text>


  <!-- ================================================= -->
  <!-- HEADER DIVIDER -->
  <!-- ================================================= -->

  <line x1="35"
        y1="58"
        x2="865"
        y2="58"
        stroke="url(#accent)"
        stroke-opacity="0.35"/>


  <!-- ================================================= -->
  <!-- LANGUAGES -->
  <!-- ================================================= -->

  <text x="40"
        y="92"
        fill="#C86CFF"
        font-family="monospace"
        font-size="14"
        font-weight="600">

    LANGUAGES

  </text>

  <text x="205"
        y="92"
        fill="#E8EDF7"
        font-family="monospace"
        font-size="14">

    → C++ · JavaScript · Python · SQL

  </text>


  <!-- ================================================= -->
  <!-- CORE CS -->
  <!-- ================================================= -->

  <text x="40"
        y="140"
        fill="#C86CFF"
        font-family="monospace"
        font-size="14"
        font-weight="600">

    CORE CS

  </text>

  <text x="205"
        y="140"
        fill="#E8EDF7"
        font-family="monospace"
        font-size="14">

    → DSA · OOP · DBMS · OS · Computer Networks

  </text>


  <!-- ================================================= -->
  <!-- FULL STACK -->
  <!-- ================================================= -->

  <text x="40"
        y="188"
        fill="#C86CFF"
        font-family="monospace"
        font-size="14"
        font-weight="600">

    FULL-STACK

  </text>

  <text x="205"
        y="188"
        fill="#E8EDF7"
        font-family="monospace"
        font-size="14">

    → React · Node.js · Express · MongoDB · REST · WebRTC · Socket.IO · JWT

  </text>

  <!-- ================================================= -->
  <!-- AI / LLM -->
  <!-- ================================================= -->

  <text x="40"
        y="250"
        fill="#C86CFF"
        font-family="monospace"
        font-size="14"
        font-weight="600">

    AI / LLM

  </text>

  <text x="205"
        y="250"
        fill="#E8EDF7"
        font-family="monospace"
        font-size="14">

    → LLM APIs · Prompt Engineering · RAG · Vector DBs

  </text>


  <!-- ================================================= -->
  <!-- SYSTEMS -->
  <!-- ================================================= -->

  <text x="40"
        y="298"
        fill="#C86CFF"
        font-family="monospace"
        font-size="14"
        font-weight="600">

    SYSTEMS

  </text>

  <text x="205"
        y="298"
        fill="#E8EDF7"
        font-family="monospace"
        font-size="14">

    → Kafka/RabbitMQ · Redis · Docker · Kubernetes · GitHub Actions · OpenTelemetry · k6

  </text>

</svg>
